    <script>
      // Automatically unregister any stale service workers or legacy cache storage on localhost
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) {
            r.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var n of names) {
            caches.delete(n);
          }
        });
      }
    </script>
