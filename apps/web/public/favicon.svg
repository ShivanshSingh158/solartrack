<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Brushed Obsidian Titanium Background Gradient -->
    <radialGradient id="titaniumBg" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#232834" />
      <stop offset="65%" stop-color="#0E1117" />
      <stop offset="100%" stop-color="#07080B" />
    </radialGradient>

    <!-- Metallic Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5565" />
      <stop offset="50%" stop-color="#232834" />
      <stop offset="100%" stop-color="#11141A" />
    </linearGradient>

    <!-- Solar Arc Radiant Ring Gradient -->
    <linearGradient id="solarArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="30%" stop-color="#D97706" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Solar Ring Ambient Glow -->
    <filter id="solarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Photon Laser Beam Gradient -->
    <linearGradient id="photonBeamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="20%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFDF5" stop-opacity="1" />
      <stop offset="80%" stop-color="#FDE047" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>

    <!-- Photon Flash Glow Filter -->
    <filter id="beamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Metallic Rim -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#titaniumBg)" stroke="url(#rimGrad)" stroke-width="1.5" />

  <!-- Subtle Concentric Optical Ring -->
  <circle cx="50" cy="50" r="28" stroke="#F59E0B" stroke-opacity="0.15" stroke-width="1" />

  <!-- Soft Diffused Solar Corona Glow -->
  <circle cx="50" cy="50" r="22" stroke="url(#solarArcGrad)" stroke-width="7" stroke-opacity="0.3" filter="url(#solarGlow)" />

  <!-- The Main Glowing Solar Arc Ring -->
  <circle cx="50" cy="50" r="22" stroke="url(#solarArcGrad)" stroke-width="6.2" stroke-linecap="round" />

  <!-- Secondary Thin Optical Ring (Echo of Irradiance) -->
  <circle cx="50" cy="50" r="24.5" stroke="#FDE047" stroke-opacity="0.25" stroke-width="0.75" />

  <!-- Diagonal 45-degree Photon Trajectory Stream -->
  <line x1="18" y1="82" x2="82" y2="18" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-opacity="0.4" filter="url(#beamGlow)" />
  <line x1="20" y1="80" x2="80" y2="20" stroke="url(#photonBeamGrad)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Center Energy Flash Spark -->
  <circle cx="50" cy="50" r="1.5" fill="#FFFFFF" />
</svg>
