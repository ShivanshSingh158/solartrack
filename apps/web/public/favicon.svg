<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107C41" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D97706" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle (Apple macOS style) -->
  <rect width="64" height="64" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Solar Core Orb with Subtle Glow -->
  <circle cx="32" cy="32" r="11" fill="url(#sunGrad)" filter="url(#glow)" />

  <!-- Solar Tracking Orbital Trajectory Sweep -->
  <path d="M 16 37 A 19 19 0 1 1 48 37" fill="none" stroke="url(#trackGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Active Tracking Ray Points -->
  <circle cx="32" cy="13" r="2.5" fill="#107C41" />
  <circle cx="18" cy="21" r="2" fill="#107C41" />
  <circle cx="46" cy="21" r="2" fill="#107C41" />

  <!-- Solar Panel Foundation Grid at Base -->
  <path d="M 22 47 L 42 47" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 26 43 L 38 43" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" />
  <path d="M 32 38 L 32 47" stroke="#107C41" stroke-width="2" stroke-linecap="round" />
</svg>
